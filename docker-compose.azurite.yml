services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000"
      - "127.0.0.1:${AZURITE_QUEUE_PORT:-10001}:10001"
      - "127.0.0.1:${AZURITE_TABLE_PORT:-10002}:10002"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10002 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
