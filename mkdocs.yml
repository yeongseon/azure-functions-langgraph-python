site_name: Azure Functions LangGraph
site_description: Deploy LangGraph agents as Azure Functions HTTP endpoints
site_author: Yeongseon Choe
site_url: https://yeongseon.dev/azure-functions-python/langgraph/
repo_url: https://github.com/yeongseon/azure-functions-langgraph-python
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: getting-started.md
      - 5-Minute Tutorial: tutorial-5-min.md
  - Deploy:
      - Choose a Plan: choose-a-plan.md
      - Deploy to Azure: deployment.md
  - Production Checklist:
      - Production Guide: production-guide.md
      - Security: security.md
  - Examples:
      - Beginner:
          - Simple Agent (walkthrough): examples/simple_agent.md
          - Azure OpenAI agent: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/azure_openai_agent
          - Conversation memory: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/conversation_memory
          - Tool calling agent: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/tool_calling_agent
          - Curl helpers: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/local_curl
      - Production:
          - Persistent production agent: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/production_persistent_agent
          - Per-graph auth: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/production_auth
          - Managed Identity storage: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/managed_identity_storage
          - Blob + Table persistence: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/persistent_agent_blob_table
          - Postgres checkpointer: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/postgres_checkpoint_production
          - App Insights telemetry: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/observability_app_insights
      - Advanced:
          - True HTTP streaming: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/true_streaming_agent
          - Streaming authorization: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/streaming_authorization
          - Platform SDK compatibility: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/platform_compat_sdk
          - Durable async runs: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/durable_async_agent
          - Service Bus agent: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/service_bus_agent
          - Service Bus sessions: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/service_bus_sessions
          - Versioned output (v2): https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/versioned_output_agent
          - Async agent: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/async_agent
          - Run observer: https://github.com/yeongseon/azure-functions-langgraph-python/tree/main/examples/run_observer
  - Reference:
      - API Reference: api.md
      - Configuration: configuration.md
      - Usage: usage.md
      - Adapter Reference & Migration: adapter-reference.md
      - API Boundary & Migration Policy: api-boundary.md
      - Public API Inventory: api-inventory.md
      - Operations & APIs: ops-and-apis.md
      - Architecture: architecture.md
      - Blob Checkpoint Format: blob-checkpoint-format.md
      - Release Status (PyPI): release-status.md
      - Changelog: changelog.md
      - Roadmap: roadmap.md
  - Troubleshooting:
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
  - Maintainers:
      - Contributing Guidelines: contributing.md
      - Development: development.md
      - Testing: testing.md
      - API Contract Gate: api-contract-gate.md
      - Release Process: release_process.md
      - Review Evidence Policy: review-evidence-policy.md
      - Hardening Status: hardening-status.md
      - Deferred Edge Triage: deferred-edge-triage.md
      - Agent Playbook: agent-playbook.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_signature: true
            show_root_full_path: false
            merge_init_into_class: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yeongseon/azure-functions-langgraph-python
  copyright: |
    © 2026 Yeongseon Choe – MIT Licensed

extra_javascript:
  - https://unpkg.com/mermaid@11.14.0/dist/mermaid.min.js
  - javascripts/mermaid-init.js
