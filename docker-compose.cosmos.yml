services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator
    ports:
      - "127.0.0.1:${COSMOS_PORT:-8081}:8081"
      - "127.0.0.1:${COSMOS_PORT_10250:-10250}:10250"
      - "127.0.0.1:${COSMOS_PORT_10251:-10251}:10251"
      - "127.0.0.1:${COSMOS_PORT_10252:-10252}:10252"
      - "127.0.0.1:${COSMOS_PORT_10253:-10253}:10253"
      - "127.0.0.1:${COSMOS_PORT_10254:-10254}:10254"
      - "127.0.0.1:${COSMOS_PORT_10255:-10255}:10255"
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=2
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=false
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8081/_explorer/emulator.pem"]
      interval: 10s
      timeout: 5s
      retries: 30
