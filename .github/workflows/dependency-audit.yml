name: Dependency Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit resolved dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install audit tool and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit==2.10.1" .

      - name: Audit runtime dependencies
        continue-on-error: true
        run: |
          set +e
          pip-audit --format markdown --progress-spinner off > runtime-audit.md
          status=$?
          {
            echo "## Runtime dependency audit"
            cat runtime-audit.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Install development dependencies
        run: python -m pip install ".[dev]"

      - name: Audit runtime and development dependencies
        continue-on-error: true
        run: |
          set +e
          pip-audit --format markdown --progress-spinner off > dev-audit.md
          status=$?
          {
            echo "## Runtime and development dependency audit"
            cat dev-audit.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
