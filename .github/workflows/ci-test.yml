name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Lint, type-check and security run once on a single pinned interpreter
  # (Python 3.11, matching the ruff/mypy target-version in pyproject). These
  # checks are interpreter-agnostic, so fanning them across the matrix would
  # only duplicate work. Installed with a plain `pip install -e '.[dev]'` so the
  # checks run on the interpreter this job provisions (NOT through the
  # Python-pinned Hatch env, which previously silently forced the whole test
  # matrix onto its default interpreter).
  quality:
    name: Lint, type-check & security (Py 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint workflows (pin hygiene + release-gate canonical SHAs)
        run: |
          python tools/lint_release_workflows.py
          python tools/lint_workflow_pins.py
          python tools/lint_hatch_matrix.py

      - name: Ruff style check
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Ruff format check (changed Python files)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_pr_format.py "$PR_BASE_SHA" "$PR_HEAD_SHA"

      - name: Type check (mypy, strict)
        run: mypy src tests

      - name: Security scan (bandit)
        run: python -m bandit -r src

  test:
    name: Test (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Run the complete suite across every interpreter advertised by the
        # package. The dependency markers select azure-functions 1.x through
        # Python 3.12 and 2.x on Python 3.13/3.14.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assert the runtime interpreter matches the matrix cell
        # Tests must run on the interpreter this cell claims to exercise. Before
        # this fix the whole matrix ran through the default pinned Hatch env,
        # so 3.11/3.12 were never actually tested. This guard fails loudly if the
        # running interpreter ever drifts from matrix.python-version again.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, sys
          expected = tuple(int(p) for p in os.environ["EXPECTED"].split("."))
          actual = sys.version_info[: len(expected)]
          assert actual == expected, f"interpreter {actual} != matrix {expected}"
          print(f"interpreter OK: {sys.version.split()[0]}")
          PY

      - name: Install package with dev extras (on the matrix interpreter)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests on the matrix interpreter
        # Raw pytest on the interpreter provisioned above (NOT through the
        # default pinned Hatch env). The repo pytest config enables --cov
        # with fail_under=95; enforce that gate on the canonical 3.11 cell and
        # run the other cells with --no-cov so a version-variant cell cannot
        # fail the build on a spurious coverage dip.
        env:
          IS_COVERAGE_CELL: ${{ matrix.python-version == '3.11' }}
        run: |
          if [ "$IS_COVERAGE_CELL" = "true" ]; then
            pytest tests/
          else
            pytest tests/ --no-cov
          fi

      - name: Verify coverage output
        if: matrix.python-version == '3.11'
        run: ls -lh coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  minimum-dependencies:
    name: Minimum dependencies (Py 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install exact declared dependency floors
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "build==1.2.2.post1" \
            "azure-functions==1.21.0" \
            "langgraph==1.0.0" \
            "langgraph-sdk==0.2.2" \
            "pydantic==2.7.4" \
            "coverage" \
            "opentelemetry-api>=1.20,<2" \
            "opentelemetry-sdk>=1.20,<2" \
            "pytest" \
            "pytest-asyncio>=0.23,<2" \
            "pytest-cov" \
            "requests" \
            "types-requests"
          python -m pip install -e . --no-deps

      - name: Report and assert resolved dependency floors
        run: |
          python -m pip show azure-functions langgraph langgraph-sdk pydantic
          python - <<'PY'
          from importlib.metadata import version

          resolved = {
              "azure-functions": version("azure-functions"),
              "langgraph": version("langgraph"),
              "langgraph-sdk": version("langgraph-sdk"),
              "pydantic": version("pydantic"),
          }
          print(f"resolved dependencies={resolved}")
          assert resolved == {
              "azure-functions": "1.21.0",
              "langgraph": "1.0.0",
              "langgraph-sdk": "0.2.2",
              "pydantic": "2.7.4",
          }
          PY

      - name: Check the minimum dependency environment
        run: python -m pip check

      - name: Run full suite against declared dependency floors
        run: |
          pytest tests/ --no-cov -q \
            --ignore=tests/test_sdk_compat.py \
            --ignore=tests/test_streaming_app.py
          pytest tests/test_sdk_contracts.py --no-cov -q

  artifact-build:
    name: Build compatibility artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-dist
          path: dist/
          if-no-files-found: error

  artifact-python310-negative:
    name: Wheel install rejection (Py 3.10, negative test)
    needs: artifact-build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.10 for negative install test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Require wheel rejection by Requires-Python
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          if output=$(python -m pip install --no-deps "$wheel" 2>&1); then
            echo "::error ::Python 3.10 unexpectedly installed the candidate wheel"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F "requires a different Python" <<<"$output"
          grep -F "3.10" <<<"$output"
          grep -F ">=3.11" <<<"$output"

  artifact-python311:
    name: Wheel install and graph smoke (Py 3.11)
    needs: artifact-build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Install wheel with runtime dependencies
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install "$wheel"

      - name: Check installed wheel outside the checkout
        working-directory: /tmp
        env:
          CHECKOUT: ${{ github.workspace }}
        run: |
          python -m pip check
          python - <<'PY'
          import os
          from pathlib import Path
          from typing import TypedDict

          import azure_functions_langgraph
          from azure_functions_langgraph import LangGraphApp
          from langgraph.graph import END, START, StateGraph

          class State(TypedDict):
              value: str

          module_path = Path(azure_functions_langgraph.__file__).resolve()
          checkout = Path(os.environ["CHECKOUT"]).resolve()
          print(f"imported module: {module_path}")
          assert not module_path.is_relative_to(checkout)

          builder = StateGraph(State)
          builder.add_node("answer", lambda state: {"value": state["value"] + "-ok"})
          builder.add_edge(START, "answer")
          builder.add_edge("answer", END)
          app = LangGraphApp()
          app.register(graph=builder.compile(), name="artifact-smoke", stream=False)
          assert builder.compile().invoke({"value": "wheel"}) == {"value": "wheel-ok"}
          PY

  langgraph-min:
    name: langgraph compat (min supported)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,azure-blob,azure-table]"

      - name: Pin langgraph to minimum supported (1.0.0)
        run: pip install "langgraph==1.0.0"

      - name: Show resolved versions
        run: pip show langgraph langgraph-sdk | grep -E '^(Name|Version):'

      - name: Run tests against minimum langgraph
        # Compatibility smoke only: `--no-cov` intentionally disables coverage
        # (and the fail_under gate) for this pinned langgraph==1.0.0 run. Because
        # it is a separate job from the coverage-enforcing matrix above, it
        # cannot mask coverage regressions -- the matrix job still enforces 95%.
        run: pytest tests/ --no-cov -q

  langgraph-sdk-legacy:
    name: langgraph-sdk compat (legacy 0.3.x)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,azure-blob,azure-table]"

      - name: Pin langgraph-sdk to the legacy supported line (>=0.3,<0.4)
        # Supported-range map: min 0.2.2 (langgraph-min lane) / legacy 0.3.x
        # (this lane) / max 0.4.x (langgraph-sdk-max lane). The floor is exercised
        # by the langgraph-min lane (langgraph==1.0.0 resolves langgraph-sdk 0.2.2).
        # This lane keeps the intermediate 0.3.x line covered so the platform-compat
        # wire-shape contracts hold across the whole supported window (issues #340,
        # #441).
        run: pip install "langgraph-sdk>=0.3,<0.4"

      - name: Show resolved versions
        run: pip show langgraph langgraph-sdk | grep -E '^(Name|Version):'

      - name: Run SDK contract tests against maximum langgraph-sdk
        # Compatibility smoke only: `--no-cov` disables the coverage gate for
        # this pinned run (a separate job from the coverage-enforcing matrix).
        run: pytest tests/test_sdk_contracts.py tests/test_sdk_compat.py --no-cov -q

  langgraph-sdk-max:
    name: langgraph-sdk compat (max supported)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,azure-blob,azure-table]"

      - name: Pin langgraph-sdk to the maximum supported line (>=0.4,<0.5)
        # Supported-range map: min 0.2.2 / legacy 0.3.x / max 0.4.x. The runtime
        # dep ceiling is langgraph-sdk<0.5 (pyproject), and langgraph core 1.2.9+
        # pins langgraph-sdk>=0.4.2,<0.5. This lane proves the platform-compat
        # wire-shape contracts hold at the real 0.4.x ceiling as a dedicated
        # SDK-contract lane, not just transitively via langgraph-latest (#441).
        run: pip install "langgraph-sdk>=0.4,<0.5"

      - name: Show resolved versions
        run: pip show langgraph langgraph-sdk | grep -E '^(Name|Version):'

      - name: Run SDK contract tests against maximum langgraph-sdk
        # Compatibility smoke only: `--no-cov` disables the coverage gate for
        # this pinned run (a separate job from the coverage-enforcing matrix).
        run: pytest tests/test_sdk_contracts.py tests/test_sdk_compat.py --no-cov -q

  langgraph-latest:
    name: langgraph compat (latest certified 1.2.x)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,azure-blob,azure-table]"

      - name: Pin langgraph to the latest certified 1.2.x + langgraph-sdk 0.4.x
        # Rolling-window certification (issue #421): langgraph core 1.2.9+ pins
        # langgraph-sdk >=0.4.2,<0.5, a line the default dev resolve now already
        # picks up. This lane pins the floor of that window explicitly so the
        # latest supported LangGraph/SDK pair is proven even if a future core
        # release temporarily regresses the default resolve. The langgraph-min
        # lane pins langgraph==1.0.0 to hold the other end of the window.
        run: pip install "langgraph>=1.2.9,<2" "langgraph-sdk>=0.4.2,<0.5"

      - name: Show resolved versions
        run: pip show langgraph langgraph-sdk | grep -E '^(Name|Version):'

      - name: Run tests against the latest certified langgraph line
        # Compatibility smoke only: `--no-cov` disables the coverage gate for this
        # pinned run (a separate job from the coverage-enforcing matrix).
        run: pytest tests/ --no-cov -q


  azure-functions-2x:
    name: azure-functions 2.x compat (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # azure-functions 2.x declares Requires-Python >=3.13, so this proof
        # lane runs on the Azure-GA interpreters that can host the 2.x worker:
        # Python 3.13 and 3.14 (both GA for Azure Functions; #350). 3.14 is a
        # non-blocking cell (continue-on-error below) only because transitive
        # dependency wheels for 3.14 may still be landing - the azure-functions
        # 2.x SDK itself is GA upstream, not exploratory. That is a statement
        # about the SDK, not about this package: real-Azure certification of
        # our 2.x path is still outstanding (#350).
        python-version: ["3.13", "3.14"]
    # 3.14 is informational until the full transitive-dependency wheel set is
    # published for 3.14; a red 3.14 cell must not block a PR. 3.13 stays
    # blocking.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        # Issue #350 requires proving 2.x against a WHEEL-installed build, not an
        # editable/source tree, so we build and install the distribution artifact.
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel with dev + storage extras
        run: pip install "$(ls dist/azure_functions_langgraph-*.whl)[dev,azure-blob,azure-table]"

      - name: Upgrade azure-functions to the 2.x line
        # pyproject caps azure-functions below 2.0.0 only on Python <3.13;
        # #457 lifted the cap on 3.13+, so on the interpreters this lane runs
        # the 2.x line is already permitted. Pinning >=2,<3 fixes the line
        # under test to PROVE the adapter surface (FunctionApp route discovery,
        # HttpRequest.get_json, HttpResponse status/headers/body, buffered-SSE
        # stream) holds under 2.x. Real-Azure certification (#350) is still
        # outstanding, which is why this lane is not a required check.
        run: pip install "azure-functions>=2,<3"

      - name: Show resolved versions
        run: pip show azure-functions langgraph langgraph-sdk | grep -E '^(Name|Version):'

      - name: Run compat suite against the wheel + azure-functions 2.x
        # Compatibility smoke only: `--no-cov` disables the coverage gate for this
        # pinned run (a separate job from the coverage-enforcing matrix). The repo
        # pytest config sets `pythonpath = ["src", "."]`, which would shadow the
        # installed wheel with the source tree; `-o pythonpath=` clears it so the
        # suite genuinely exercises the wheel-installed package.
        run: pytest tests/ --no-cov -q -o "pythonpath="

  host-smoke:
    name: Real Functions host smoke (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Functions Core Tools v4 and Azurite
        run: |
          npm install --global azure-functions-core-tools@4 --unsafe-perm true
          npm install --global azurite

      - name: Install smoke app dependencies in its local environment
        working-directory: tests/host_smoke
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Start Azurite and Functions host
        run: |
          azurite --silent > /tmp/azurite.log 2>&1 &
          cd tests/host_smoke
          PATH="$PWD/.venv/bin:$PATH" func start --python --port 7071 > /tmp/functions-host.log 2>&1 &

      - name: Invoke the registered StateGraph through the native route
        run: |
          for attempt in {1..30}; do
            if response="$(curl --fail --silent \
              --header 'Content-Type: application/json' \
              --data '{"input":{"messages":[{"role":"user","content":"ping"}]}}' \
              http://127.0.0.1:7071/api/graphs/smoke/invoke)"; then
              python -c 'import json, sys; body=json.loads(sys.argv[1]); messages=body["output"]["messages"]; assert messages[-1]["content"] == "host smoke passed"; assert messages[-1]["type"] == "ai"' "$response"
              if grep -qE '0 functions|Worker failed|Host startup operation has been canceled|Error indexing method' /tmp/functions-host.log; then
                cat /tmp/functions-host.log
                exit 1
              fi
              exit 0
            fi
            sleep 2
          done
          cat /tmp/functions-host.log
          exit 1

  # The single required status check for branch protection.
  #
  # Branch protection matches required checks by literal name, so requiring
  # matrix cells couples it to the matrix: dropping a version removes the job
  # that produced that name, the check is then never reported, and GitHub holds
  # it pending forever -- blocking every PR, Dependabot and Release Please
  # included, until an admin edits settings.
  #
  # This job's name survives matrix changes. `if: always()` guarantees it always
  # reports, and it reads every dependency's result, so a skipped or cancelled
  # job cannot pass by not being a failure.
  ci-required:
    needs:
      - quality
      - test
      - minimum-dependencies
      - artifact-build
      - artifact-python310-negative
      - artifact-python311
      - langgraph-min
      - langgraph-latest
      - langgraph-sdk-legacy
      - langgraph-sdk-max
      - azure-functions-2x
      - host-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EVAL'
          import json, os, sys

          results = json.loads(os.environ["RESULTS"])
          for job, data in sorted(results.items()):
              print(f"{job}: {data['result']}")
          failed = sorted(j for j, d in results.items() if d["result"] != "success")
          if failed:
              sys.exit(f"::error::Required checks did not all succeed: {failed}")
          print("All gating jobs succeeded.")
          EVAL
