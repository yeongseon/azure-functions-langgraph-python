name: Publish to PyPI

on:
  push:
    # Trigger the workflow on tag pushes matching v* (e.g., v1.0.0)
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

# Verify-before-publish gate (see AGENTS.md):
#   build -> lib-tests + wheel-tests -> verify-azure-certification -> publish
# Tiered runtime verification before any PyPI upload:
#   * lib-tests            : the library's own unit suite run against the source
#                            tree; this is where the >=95% coverage gate is enforced.
#   * wheel-tests          : the same unit suite run against the *installed built
#                            wheel* (imports resolve from site-packages, not src/),
#                            so packaging regressions - missing files, bad metadata,
#                            install-only import errors - fail fast in the per-publish
#                            path instead of only in the heavyweight Azure tier.
#                            Coverage is not re-measured here (owned by lib-tests).
#   * verify-azure-certification : requires the EXACT release commit to have passed a real-Azure
#                            deploy+live-e2e certification (e2e-azure.yml) that is fresh and
#                            version/SHA-matched. Real Azure is certified per release, not per publish.
# Unlike the sibling repos, this package has NO cookbook host-smoke tier: the real-Azure e2e
# (e2e-azure.yml) deploys this package's own example app and exercises the native LangGraph HTTP
# routes (health/invoke/stream). That IS the package-native runtime proof, and the candidate is
# certified from a wheel built off the release ref (not the last-published PyPI build), so a
# runtime regression in the release commit cannot slip through to PyPI.
# The publish job uploads the EXACT artifact that was tested; it never rebuilds.
# A tag whose gate fails is a failed release candidate: the version stays
# unpublished. Recover by fixing forward and cutting the next patch tag
# (never move a tag that may already have been consumed).
jobs:
  build:
    name: Build & verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Check if tag matches __version__
        id: version
        run: |
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION_FROM_FILE=$(grep -Po '(?<=__version__ = ")[^"]*' src/azure_functions_langgraph/__init__.py)
          TAG_VERSION=${TAG_NAME#v}
          echo "Version from file: $VERSION_FROM_FILE"
          echo "Tag name: $TAG_NAME"
          echo "Version from tag: $TAG_VERSION"
          if [ "$VERSION_FROM_FILE" != "$TAG_VERSION" ]; then
            echo "::error ::Version in __init__.py ($VERSION_FROM_FILE) does not match git tag ($TAG_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build distribution packages
        run: python -m build


      - name: Verify built wheel is non-empty and importable
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/*.whl)
          echo "Inspecting $WHEEL"
          MODCOUNT=$(python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(len([n for n in z.namelist() if n.endswith('.py')]))" "$WHEEL")
          echo "Wheel contains $MODCOUNT .py modules"
          if [ "$MODCOUNT" -eq 0 ]; then
            echo "::error ::Built wheel is EMPTY (0 .py modules) — refusing to publish"
            exit 1
          fi
          python -m venv /tmp/verify-wheel
          /tmp/verify-wheel/bin/pip install --upgrade pip
          /tmp/verify-wheel/bin/pip install "$WHEEL"
          /tmp/verify-wheel/bin/python -c "import azure_functions_langgraph; print('import OK', azure_functions_langgraph.__version__)"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  lib-tests:
    name: Library tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: pip install hatch

      - name: Run test suite
        run: hatch run test

  wheel-tests:
    name: Wheel packaging tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download built distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      # Install the *built wheel* (plus its test-only dev deps) so the suite
      # imports the package from site-packages, not the checked-out src/ tree.
      # This is what turns lib-tests' source-tree run into a real packaging
      # gate: missing wheel files, bad metadata, or install-only import errors
      # surface here in the fast per-publish path instead of only in the
      # heavyweight Azure certification tier.
      - name: Install built wheel
        run: |
          python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          echo "Installing ${WHEEL}[dev]"
          python -m pip install "${WHEEL}[dev]"

      # Run from a scratch dir with a dedicated config (tools/wheel-tests.ini)
      # that omits `pythonpath = ["src", "."]` and coverage, so nothing re-adds
      # the source tree to sys.path. --import-mode=importlib prevents test dirs
      # from shadowing the installed distribution. Coverage stays owned by the
      # source-tree lib-tests tier; this tier only proves the artifact imports
      # and behaves once installed.
      - name: Run test suite against installed wheel
        run: |
          mkdir -p "${RUNNER_TEMP}/wheel-tests"
          cd "${RUNNER_TEMP}/wheel-tests"
          python -m pytest \
            -c "${GITHUB_WORKSPACE}/tools/wheel-tests.ini" \
            --import-mode=importlib \
            -p no:cacheprovider \
            -m "not e2e" \
            "${GITHUB_WORKSPACE}/tests"

  verify-azure-certification:
    name: Verify Azure release certification
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Locate successful Azure certification for this commit
        id: cert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          # A release may only publish if the EXACT commit was certified against
          # real Azure by the trusted certification workflow (see e2e-azure.yml).
          RUN_ID=$(gh run list \
            --workflow e2e-azure.yml \
            --json databaseId,headSha,conclusion \
            --limit 50 \
            --jq "[.[] | select(.headSha==\"$COMMIT\" and .conclusion==\"success\")] | first | .databaseId")
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error ::No successful Azure certification run found for commit $COMMIT. Dispatch the 'e2e-azure' workflow on this release commit before publishing."
            exit 1
          fi
          echo "Found certification run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download certification record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: azure-cert
          path: cert
          run-id: ${{ steps.cert.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Assert certification matches this release
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          FRESHNESS_DAYS: "14"
        run: |
          python3 - "$COMMIT" "$VERSION" "$FRESHNESS_DAYS" <<'PY'
          import json, sys, datetime, pathlib
          commit, version, fresh_days = sys.argv[1], sys.argv[2], int(sys.argv[3])
          cert = json.loads(pathlib.Path("cert/certification.json").read_text())
          def fail(m):
              print(f"::error ::{m}")
              sys.exit(1)
          if cert.get("result") != "success":
              fail("certification result is not success")
          if cert.get("package") != "azure-functions-langgraph":
              fail(f"cert package {cert.get('package')} != azure-functions-langgraph")
          if cert.get("commit") != commit:
              fail(f"cert commit {cert.get('commit')} != release commit {commit}")
          if cert.get("version") != version:
              fail(f"cert version {cert.get('version')} != release version {version}")
          ts = cert.get("certified_at")
          if not ts:
              fail("cert missing certified_at")
          certified = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
          age = datetime.datetime.now(datetime.timezone.utc) - certified
          if age > datetime.timedelta(days=fresh_days):
              fail(f"certification is stale: {age.days}d > {fresh_days}d")
          print(f"Azure certification verified: {version}@{commit[:12]} certified {age.days}d ago")
          PY

  publish:
    name: Publish to PyPI
    needs: [build, lib-tests, wheel-tests, verify-azure-certification]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download tested distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist


      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # pin-exempt: PyPA official publisher (trusted-publisher OIDC); tracks release/v1 by design
