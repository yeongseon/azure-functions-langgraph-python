name: Table Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/azure_functions_langgraph/checkpointers/**"
      - "src/azure_functions_langgraph/stores/**"
      - "src/azure_functions_langgraph/triggers/**"
      - "src/azure_functions_langgraph/locks/**"
      - "src/azure_functions_langgraph/app.py"
      - "src/azure_functions_langgraph/platform/stores.py"
      - "tests/integration/**"
      - "tests/storage_service.py"
      - "tests/test_production_persistent_agent_example.py"
      - "examples/production_persistent_agent/**"
      - "pyproject.toml"
      - "tools/check_junit.py"
      - ".github/workflows/ci-table-integration.yml"
  push:
    branches: [main]
    paths:
      - "src/azure_functions_langgraph/checkpointers/**"
      - "src/azure_functions_langgraph/stores/**"
      - "src/azure_functions_langgraph/triggers/**"
      - "src/azure_functions_langgraph/locks/**"
      - "src/azure_functions_langgraph/app.py"
      - "src/azure_functions_langgraph/platform/stores.py"
      - "tests/integration/**"
      - "tests/storage_service.py"
      - "tests/test_production_persistent_agent_example.py"
      - "examples/production_persistent_agent/**"
      - "pyproject.toml"
      - "tools/check_junit.py"
      - ".github/workflows/ci-table-integration.yml"

permissions:
  contents: read

jobs:
  table-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,azure-table,azure-blob]"

      - name: Start Azurite with storage SDK API-version compatibility
        run: |
          docker run --detach --rm --name azurite \
            --publish 127.0.0.1:10000:10000 --publish 127.0.0.1:10001:10001 --publish 127.0.0.1:10002:10002 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite --skipApiVersionCheck \
              --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
          for attempt in {1..20}; do
            if nc -z 127.0.0.1 10000 && nc -z 127.0.0.1 10002; then
              exit 0
            fi
            sleep 1
          done
          docker logs azurite
          exit 1

      - name: Run Azurite integration tests without skips
        env:
          AZURITE_REQUIRED: true
        run: |
          pytest -v --strict-markers -m integration \
            tests/integration/test_table_store_integration.py \
            tests/integration/test_checkpoint_conformance.py \
            tests/test_production_persistent_agent_example.py \
            --no-cov --junitxml=/tmp/azurite-results.xml
          python tools/check_junit.py /tmp/azurite-results.xml \
            --area "Table integration=table_store_integration" \
            --area "Blob conformance=checkpoint_conformance" \
            --area "production persistent agent=production_persistent_agent"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: table-integration-junit
          path: /tmp/azurite-results.xml
          retention-days: 7
          if-no-files-found: warn
