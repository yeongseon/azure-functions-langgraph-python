name: Table Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/azure_functions_langgraph/checkpointers/**"
      - "src/azure_functions_langgraph/stores/**"
      - "src/azure_functions_langgraph/triggers/**"
      - "src/azure_functions_langgraph/locks/**"
      - "src/azure_functions_langgraph/app.py"
      - "src/azure_functions_langgraph/platform/stores.py"
      - "tests/integration/**"
      - "tests/storage_service.py"
      - "tests/test_production_persistent_agent_example.py"
      - "examples/production_persistent_agent/**"
      - "pyproject.toml"
      - "tools/verification*.py"
      - "Makefile"
      - "docker-compose.azurite.yml"
      - ".github/workflows/ci-table-integration.yml"
  push:
    branches: [main]
    paths:
      - "src/azure_functions_langgraph/checkpointers/**"
      - "src/azure_functions_langgraph/stores/**"
      - "src/azure_functions_langgraph/triggers/**"
      - "src/azure_functions_langgraph/locks/**"
      - "src/azure_functions_langgraph/app.py"
      - "src/azure_functions_langgraph/platform/stores.py"
      - "tests/integration/**"
      - "tests/storage_service.py"
      - "tests/test_production_persistent_agent_example.py"
      - "examples/production_persistent_agent/**"
      - "pyproject.toml"
      - "tools/verification*.py"
      - "Makefile"
      - "docker-compose.azurite.yml"
      - ".github/workflows/ci-table-integration.yml"

permissions:
  contents: read

jobs:
  table-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install-ci

      - name: Run Azurite integration tests without skips
        run: make test-table

      - name: Upload strict storage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: table-integration-evidence
          path: test-results/**
